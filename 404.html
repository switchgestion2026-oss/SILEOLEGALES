  <title>Página no encontrada | Sileo Legal Estudio Jurídico</title>

  <style>
:root{--cream:#F1EBDD;--green:#20382F;--gold:#B49A68;--gold-light:#D0B786;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",Arial,sans-serif;--gutter:clamp(20px,6vw,96px)}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--green);color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.brand{display:flex;align-items:center;gap:12px;padding:24px var(--gutter)}
.brand-mark{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1;letter-spacing:-.05em;color:var(--gold-light)}
.brand-copy strong{display:block;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.2em}
.brand-copy small{display:block;font-size:10px;letter-spacing:.22em}
main{flex:1;display:grid;place-items:center;padding:40px var(--gutter) 80px;position:relative;overflow:hidden;isolation:isolate;text-align:center}
main::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:min(90vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(208,183,134,.35);border-radius:50%;box-shadow:0 0 0 36px rgba(180,154,104,.04)}
.code{font-family:var(--serif);font-size:clamp(88px,18vw,180px);line-height:1;color:var(--gold-light)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,52px);line-height:1.1;margin:8px 0 14px}
h1 em{color:var(--gold-light)}
p{margin:0 auto 34px;max-width:42ch;color:rgba(241,235,221,.82)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;font-size:15px;font-weight:500;background:var(--gold-light);color:var(--green);transition:background .25s}
.btn:hover{background:var(--cream)}
  </style>
</head>
<body>
  <a class="brand" href="index.html" aria-label="Sileo Legal, volver al inicio">
    <span class="brand-mark" aria-hidden="true">SL</span>
    <span class="brand-copy"><strong>SILEO LEGAL</strong><small>ESTUDIO JURÍDICO</small></span>
  </a>
  <main>
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Esta página <em>no existe.</em></h1>
      <p>Es posible que el enlace haya cambiado. Vuelva al inicio para encontrar lo que necesita.</p>
      <a class="btn" href="index.html">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
